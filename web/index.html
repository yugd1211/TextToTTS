<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TextToTTS Capture</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 20px; max-width: 720px; }
    textarea, input { width: 100%; margin-top: 8px; margin-bottom: 16px; padding: 10px; }
    button { padding: 10px 14px; margin-right: 8px; }
    .hint { color: #444; font-size: 14px; }
  </style>
</head>
<body>
  <h1>오디오북 캡처 도우미</h1>
  <p class="hint">1) 제목/내용 입력 → 2) Markdown 다운로드 → 3) GitHub 저장소의 <code>content/</code>에 업로드</p>
  <p class="hint">업로드하면 GitHub Action이 자동으로 <code>audio/*.mp3</code>를 생성합니다.</p>

  <label>제목</label>
  <input id="title" placeholder="예: 러닝 중 듣는 LLM 메모" />

  <label>내용</label>
  <textarea id="text" rows="12" placeholder="질문/답변, 핵심 내용을 붙여넣으세요."></textarea>

  <button onclick="downloadMarkdown()">Markdown 다운로드</button>

<script>
function ts(){
  const d = new Date();
  const pad = (n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
function sanitize(v){ return v.toLowerCase().replace(/[^a-z0-9가-힣_-]+/g,'-').replace(/^-+|-+$/g,'') || 'note'; }
function downloadMarkdown(){
  const title = document.getElementById('title').value.trim() || '제목 없음';
  const text = document.getElementById('text').value.trim();
  if(!text){ alert('내용을 입력하세요.'); return; }
  const md = `# ${title}\n\n- source: mobile/web capture\n\n## 핵심 요약\n\n${text}\n\n## 오디오북용 스크립트\n\n${text}\n`;
  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${ts()}-${sanitize(title)}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
