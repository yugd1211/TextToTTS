name: Build TTS from Content

on:
  push:
    paths:
      - 'content/**/*.md'
  workflow_dispatch:
    inputs:
      content_file:
        description: 'content/*.md file to convert'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tts:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Resolve target files
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' '${{ github.event.inputs.content_file }}' > /tmp/targets.txt
          else
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^content/.*\.md$' > /tmp/targets.txt || true
          fi
          cat /tmp/targets.txt
      - name: Generate audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_MODEL: gpt-4o-mini-tts
          OPENAI_TTS_VOICE: coral
          OPENAI_TTS_FORMAT: mp3
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            python scripts/generate_tts.py "$f"
          done < /tmp/targets.txt
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "No audio changes"
            exit 0
          fi
          git commit -m "chore(tts): generate audio"
          git push
